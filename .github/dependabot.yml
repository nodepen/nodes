version: 2

updates:
  - directory: "/"
    package-ecosystem: "npm"
    schedule:
      interval: "weekly"
      day: "friday"
    allow:
      - dependency-type: "direct"
    open-pull-requests-limit: 3
    groups:
      dev:
        patterns:
          - "@typescript-eslint/*"
          - "concurrently"
          - "tsc-alias"
          - "tsc-watch"
          - "turbo"
          - "eslint*"
          - "prettier"
    ignore:
      - dependency-name: "@types/three"
    versioning-strategy: "increase"
